- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: travel,life
  description: Shows the next departures for selected Transport for Ireland stops using the NTA GTFS-Realtime feed.
- keyname: nta_api_key
  field_type: password
  name: NTA GTFS-R API Key
  description: Your subscription key from developer.nationaltransport.ie.
  placeholder: Paste your NTA subscription key
- keyname: stop_1
  field_type: string
  name: Stop 1
  description: Search and copy a stop code at <a href="https://tfi-trmnl-bus.xanderjake.workers.dev/stops" class="underline" target="_blank">the stop finder</a>, then paste it here.
  placeholder: "1278"
- keyname: stop_2
  field_type: string
  name: Stop 2
  description: Optional. Paste another stop code or GTFS stop ID.
  placeholder: "297"
  optional: true
- keyname: stop_3
  field_type: string
  name: Stop 3
  description: Optional. Paste another stop code or GTFS stop ID.
  optional: true
- keyname: stop_4
  field_type: string
  name: Stop 4
  description: Optional. Paste another stop code or GTFS stop ID.
  optional: true
- keyname: stop_5
  field_type: string
  name: Stop 5
  description: Optional. Paste another stop code or GTFS stop ID.
  optional: true
- keyname: departure_count
  field_type: number
  name: Departures To Show
  description: Full-screen layouts can show up to eight rows; smaller layouts automatically show fewer.
  default: 8
  min: 1
  max: 10
- keyname: time_zone
  field_type: time_zone
  name: Time Zone
  description: Used for display times.
  default: Europe/Dublin
